<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanner · Purchasing Tool</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    .page-wrap { padding: 20px; max-width: 1400px; margin: 0 auto; }

    /* ── Drop Zone ── */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg-2);
      position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(31,111,235,0.05);
    }
    .drop-zone.drag-over { transform: scale(1.01); }
    .drop-zone input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-icon { color: var(--text-3); margin-bottom: 12px; }
    .drop-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .drop-sub   { font-size: 13px; color: var(--text-2); }

    /* ── File Queue ── */
    .file-queue {
      display: flex; flex-direction: column; gap: 6px;
      margin-top: 16px;
    }
    .file-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px 12px;
    }
    .file-item-name { flex: 1; font-size: 13px; font-family: var(--font-mono); color: var(--text); }
    .file-item-size { font-size: 11px; color: var(--text-3); }
    .file-status { font-size: 11px; font-family: var(--font-mono); padding: 2px 8px; border-radius: 99px; }
    .file-status.pending  { background: var(--bg-3); color: var(--text-3); }
    .file-status.loading  { background: #0a1f3a; color: var(--accent-2); }
    .file-status.done     { background: #1a3a1e; color: var(--green); }
    .file-status.error    { background: #3a1a1a; color: var(--red); }

    /* ── Review Section ── */
    .review-section {
      margin-top: 24px;
      display: none;
    }
    .review-section.visible { display: block; }

    .review-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; flex-wrap: wrap; gap: 10px;
    }
    .review-title { font-size: 15px; font-weight: 700; }
    .review-title span { font-size: 12px; color: var(--text-3); font-family: var(--font-mono); margin-left: 8px; }

    /* ── PO Cards ── */
    .po-cards { display: flex; flex-direction: column; gap: 16px; }

    .po-card {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
    }
    .po-card.excluded { opacity: 0.45; }

    .po-card-header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      background: var(--bg-3); border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .po-card-toggle {
      background: none; border: none; cursor: pointer;
      color: var(--text-2); padding: 4px; border-radius: 4px;
      display: flex; align-items: center;
      transition: background 0.15s;
    }
    .po-card-toggle:hover { background: var(--border); }

    .po-num  { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--text); }
    .po-sup  { font-size: 13px; color: var(--text-2); }
    .po-meta { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }
    .po-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 99px;
      font-size: 10px; font-family: var(--font-mono); font-weight: 600;
    }
    .badge-native { background:#1a3a1e; color:var(--green); border:1px solid #2d5a32; }
    .badge-ocr    { background:#3a2e0a; color:var(--yellow); border:1px solid #5a480f; }

    .po-card-exclude {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-2); cursor: pointer;
      user-select: none;
    }
    .po-card-exclude input { accent-color: var(--accent); cursor: pointer; }

    /* ── Editable Table ── */
    .po-items-table { width: 100%; overflow-x: auto; }
    table.edit-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.edit-table th {
      background: var(--bg-3); padding: 7px 10px;
      font-family: var(--font-mono); font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-2); border-bottom: 1px solid var(--border);
      white-space: nowrap; text-align: left;
    }
    table.edit-table td {
      padding: 0; border-bottom: 1px solid var(--border-2);
      vertical-align: middle;
    }
    table.edit-table td input,
    table.edit-table td select {
      width: 100%; box-sizing: border-box;
      background: transparent; border: none; outline: none;
      color: var(--text); font-family: var(--font-sans); font-size: 12px;
      padding: 7px 10px;
      transition: background 0.1s;
    }
    table.edit-table td input:focus,
    table.edit-table td select:focus {
      background: rgba(31,111,235,0.08);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    table.edit-table td select { cursor: pointer; }
    table.edit-table td select option { background: var(--bg-2); }
    table.edit-table tr:hover td { background: var(--bg-3); }
    table.edit-table tr:hover td input,
    table.edit-table tr:hover td select { background: transparent; }

    .calc-cell {
      padding: 7px 10px !important;
      font-family: var(--font-mono); font-size: 11px;
      color: var(--green); font-weight: 600;
      white-space: nowrap;
    }

    .btn-del-row {
      background: none; border: none; cursor: pointer;
      color: var(--text-3); padding: 5px 8px;
      border-radius: 4px; display: flex; align-items: center;
      transition: all 0.15s;
    }
    .btn-del-row:hover { color: var(--red); background: rgba(248,81,73,0.1); }

    /* ── Month selector ── */
    .month-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; background: var(--bg-3);
      border-top: 1px solid var(--border);
    }
    .month-bar label { font-size: 13px; font-weight: 600; color: var(--text); }
    .month-bar select {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: 13px; padding: 6px 10px; outline: none; cursor: pointer;
    }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); font-family: var(--font-sans); font-size: 13px; font-weight: 500; border: 1px solid transparent; cursor: pointer; transition: all 0.15s; text-decoration: none; white-space: nowrap; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary  { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-2); }
    .btn-secondary{ background: var(--bg-3); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover:not(:disabled){ background: var(--border); }
    .btn-danger   { background: #4d1515; color: var(--red); border-color: #6a2020; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* ── Toast ── */
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 11px 16px; font-size: 13px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px; min-width: 240px; animation: slideUp 0.2s ease; }
    @keyframes slideUp { from { transform: translateY(10px); opacity:0; } to { transform: translateY(0); opacity:1; } }
    .toast.success { border-color: #2d5a32; }
    .toast.error   { border-color: #5a2d2d; }

    /* ── Empty ── */
    .empty-hint { text-align:center; padding:40px; color:var(--text-3); font-size:13px; }
  </style>
</head>
<body>

<!-- Top Nav -->
<nav class="topnav">
  <a href="index.html" class="brand">
    <div class="brand-icon"><i data-lucide="clipboard-list" style="width:16px;height:16px;color:#fff;"></i></div>
    <span class="brand-text">PURCHASE<span>/TOOL</span></span>
  </a>
  <div style="display:flex;align-items:center;gap:4px;">
      <nav>
        <a href="index.html"><i data-lucide="home" style="width:14px;height:14px;"></i> <span>Home</span></a>
        <a href="scanner.html" class="active"><i data-lucide="scan" style="width:14px;height:14px;"></i> <span>Scanner</span></a>
        <a href="monitoring.html"><i data-lucide="table" style="width:14px;height:14px;"></i> <span>Monitoring</span></a>
        <a href="canvass.html"><i data-lucide="table-2" style="width:14px;height:14px;"></i> <span>Canvass</span></a>
        <a href="dashboard.html"><i data-lucide="bar-chart-2" style="width:14px;height:14px;"></i> <span>Dashboard</span></a>
        <a href="suppliers.html"><i data-lucide="building-2" style="width:14px;height:14px;"></i> <span>Suppliers</span></a>
        <a href="accountability.html"><i data-lucide="shield-check" style="width:14px;height:14px;"></i> <span>Accountability</span></a>
      </nav>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
      <i data-lucide="moon" style="width:16px;height:16px;" id="theme-icon"></i>
    </button>
  </div>
</nav>
<script src="theme.js"></script>

<div class="page-wrap">

  <!-- ── Step 1: Drop Zone ── -->
  <div style="margin-bottom:8px;">
    <h2 style="font-size:16px;font-weight:700;margin-bottom:4px;">PO Scanner</h2>
    <p style="font-size:13px;color:var(--text-2);">Upload PO PDFs → review extracted data → save to Monitoring</p>

  <div class="drop-zone" id="drop-zone">

  <!-- File queue -->

  <!-- Extract button -->

    <button class="btn btn-primary" id="extract-btn" disabled>

    </button>

    </button>

  <!-- ── Step 2: Review ── -->
  <div class="review-section" id="review-section">

      <div class="review-title">
        Review Extracted Data

      </div>
      <div style="display:flex;gap:8px;">

    <div class="po-cards" id="po-cards"></div>

    <!-- Month + Save bar -->
    <div class="month-bar" style="margin-top:16px;border-radius:var(--radius-lg);border:1px solid var(--border);">
      <label>Save to month:</label>
      <select id="target-month">
        <option value="JAN">January</option>
        <option value="FEB">February</option>
        <option value="MAR">March</option>
        <option value="APR">April</option>
        <option value="MAY">May</option>
        <option value="JUN">June</option>
        <option value="JUL">July</option>
        <option value="AUG">August</option>
        <option value="SEP">September</option>
        <option value="OCT">October</option>
        <option value="NOV">November</option>
        <option value="DEC">December</option>
      </select>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
        <span id="save-summary" style="font-size:12px;color:var(--text-3);font-family:var(--font-mono);"></span>
        <button class="btn btn-primary" id="save-btn">
          <i data-lucide="save" style="width:14px;height:14px;"></i> Save to Monitoring
        </button>
        <a href="monitoring.html" class="btn btn-secondary btn-sm">
          <i data-lucide="table" style="width:12px;height:12px;"></i> Go to Monitoring
        </a>
      </div>
    </div>
  </div>

</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
let queuedFiles   = [];   // File objects waiting to extract
let extractedPOs  = [];   // { filename, method, po_number, supplier, rows[], excluded }

// ═══════════════════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════════════════
function fmt(n) {
  if (!n && n !== 0) return "—";
  const num = parseFloat(n);
  if (isNaN(num)) return "—";
  return "₱" + num.toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/1024/1024).toFixed(1) + " MB";
}
function toast(msg, type = "success") {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type === "success" ? "✅" : "❌"}</span><span>${msg}</span>`;
  document.getElementById("toast-container").appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function escVal(s) { return String(s || "").replace(/"/g, "&quot;"); }

// ═══════════════════════════════════════════════════════════════════════════
// DROP ZONE
// ═══════════════════════════════════════════════════════════════════════════
const dropZone  = document.getElementById("drop-zone");
const fileInput = document.getElementById("file-input");

dropZone.addEventListener("dragover",  e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
dropZone.addEventListener("dragleave", e => { dropZone.classList.remove("drag-over"); });
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("drag-over");
  addFiles([...e.dataTransfer.files].filter(f => f.name.toLowerCase().endsWith(".pdf")));
});
fileInput.addEventListener("change", () => {
  addFiles([...fileInput.files]);
  fileInput.value = "";
});

document.getElementById("add-more-btn").addEventListener("click", () => fileInput.click());

function addFiles(files) {
  for (const f of files) {
    if (!queuedFiles.find(q => q.name === f.name && q.size === f.size)) {
      queuedFiles.push(f);
    }
  }
  renderQueue();
}

function renderQueue() {
  const q = document.getElementById("file-queue");
  if (!queuedFiles.length) { q.innerHTML = ""; document.getElementById("extract-btn").disabled = true; return; }

  q.innerHTML = queuedFiles.map((f, i) => `
    <div class="file-item" id="fitem-${i}">
      <i data-lucide="file-text" style="width:16px;height:16px;color:var(--red);flex-shrink:0;"></i>
      <span class="file-item-name">${f.name}</span>
      <span class="file-item-size">${fmtSize(f.size)}</span>
      <span class="file-status pending" id="fstatus-${i}">Pending</span>
      <button class="btn-del-row" onclick="removeFile(${i})" title="Remove">
        <i data-lucide="x" style="width:12px;height:12px;"></i>
      </button>
    </div>`).join("");
  lucide.createIcons();
  document.getElementById("extract-btn").disabled = false;
  document.getElementById("extract-bar").style.display = "flex";
}

function removeFile(i) {
  queuedFiles.splice(i, 1);
  renderQueue();
}

document.getElementById("clear-btn").addEventListener("click", () => {
  queuedFiles = [];
  renderQueue();
  document.getElementById("extract-bar").style.display = "none";
});

// ═══════════════════════════════════════════════════════════════════════════
// EXTRACT
// ═══════════════════════════════════════════════════════════════════════════
document.getElementById("extract-btn").addEventListener("click", async () => {
  if (!queuedFiles.length) return;

  const btn = document.getElementById("extract-btn");
  const status = document.getElementById("extract-status");
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader" style="width:14px;height:14px;animation:spin 1s linear infinite;"></i> Extracting…';
  lucide.createIcons();

  // Mark all as loading
  queuedFiles.forEach((f, i) => {
    const el = document.getElementById(`fstatus-${i}`);
    if (el) { el.textContent = "Reading…"; el.className = "file-status loading"; }
  });

  const formData = new FormData();
  queuedFiles.forEach(f => formData.append("pdfs", f));

  try {
    status.textContent = `Sending ${queuedFiles.length} PDF(s) to server…`;
    const res  = await fetch("/api/scanner/extract", { method: "POST", body: formData });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || "Extraction failed");

    // Update file statuses
    data.results.forEach((r, i) => {
      const el = document.getElementById(`fstatus-${i}`);
      if (el) { el.textContent = `✓ ${r.items_count} items`; el.className = "file-status done"; }
    });
    data.errors.forEach((e, i) => {
      const idx = queuedFiles.findIndex(f => f.name === e.file || e.file.includes(f.name));
      const el = document.getElementById(`fstatus-${idx >= 0 ? idx : i}`);
      if (el) { el.textContent = "Error"; el.className = "file-status error"; }
    });

    // Merge into extractedPOs (don't duplicate)
    for (const r of data.results) {
      const exists = extractedPOs.findIndex(p => p.po_number === r.po_number && r.po_number);
      if (exists >= 0) {
        extractedPOs[exists] = { ...r, excluded: false };
      } else {
        extractedPOs.push({ ...r, excluded: false });
      }
    }

    queuedFiles = [];
    renderQueue();
    renderReview();
    status.textContent = `Extracted ${data.results.length} PO(s)`;

    if (data.errors.length) {
      toast(`${data.errors.length} file(s) failed to extract`, "error");
    }

  } catch(e) {
    toast("Extraction error: " + e.message, "error");
    status.textContent = "Error — " + e.message;
    queuedFiles.forEach((f, i) => {
      const el = document.getElementById(`fstatus-${i}`);
      if (el) { el.textContent = "Error"; el.className = "file-status error"; }
    });
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="scan-search" style="width:14px;height:14px;"></i> Extract PO Data';
    lucide.createIcons();
  }
});

// ═══════════════════════════════════════════════════════════════════════════
// REVIEW RENDER
// ═══════════════════════════════════════════════════════════════════════════
const STATUS_OPTIONS = ["","Served","For Delivery","Pending","Cancelled"];

function renderReview() {
  const section = document.getElementById("review-section");
  const cards   = document.getElementById("po-cards");

  if (!extractedPOs.length) {
    section.classList.remove("visible");
    return;
  }
  section.classList.add("visible");

  // Set default month to current
  const monthSel = document.getElementById("target-month");
  const months   = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  monthSel.value = months[new Date().getMonth()];

  document.getElementById("review-count").textContent =
    `${extractedPOs.filter(p => !p.excluded).length} PO(s) ready`;

  cards.innerHTML = extractedPOs.map((po, pi) => `
    <div class="po-card ${po.excluded ? "excluded" : ""}" id="po-card-${pi}">
      <div class="po-card-header">
        <button class="po-card-toggle" onclick="toggleCard(${pi})" id="toggle-${pi}">
          <i data-lucide="chevron-down" style="width:16px;height:16px;"></i>
        </button>
        <div>
          <span class="po-num">${po.po_number || "— No PO Number"}</span>
          <span class="po-sup" style="margin-left:10px;">${po.supplier || "— No Supplier"}</span>
        </div>
        <span class="po-badge ${po.method === "native" ? "badge-native" : "badge-ocr"}">
          ${po.method === "native" ? "✓ Text" : "⚡ OCR"}
        </span>
        <span class="po-meta">${po.items_count} item(s)${po.charges_count ? ` + ${po.charges_count} charge(s)` : ''}</span>
        <span class="po-meta">${po.filename}</span>
        ${po.total_amount ? `<span class="po-meta">Total: ₱${po.total_amount}</span>` : ""}
        <label class="po-card-exclude">
          <input type="checkbox" ${po.excluded ? "checked" : ""}
            onchange="toggleExclude(${pi}, this.checked)" />
          Skip this PO
        </label>
      </div>

      <div class="po-items-table" id="po-items-${pi}">
        ${renderItemsTable(po, pi)}
      </div>
    </div>`).join("");

  lucide.createIcons();
  updateSaveSummary();
}

function renderItemsTable(po, pi) {
  if (!po.rows || !po.rows.length)
    return `<div class="empty-hint">No items extracted from this PDF.</div>`;

  const EDITABLE_PO = ["PR NO.","REQUESTING DEPT.","PR DATE","PO DATE","PO NUMBER",
                        "SUPPLIER'S NAME","END USER/S","PAYMENT TERMS","PURCHASE ORDER STATUS"];
  const EDITABLE_ITEM = ["ITEM CODE","ITEM DESCRIPTION","SPECIFICATIONS","QTY","UoM","UNIT PRICE"];

  return `
  <table class="edit-table">
    <thead>
      <tr>
        <th>PR No.</th>
        <th>Dept</th>
        <th>PO Date</th>
        <th>PO Number</th>
        <th>Supplier</th>
        <th>Item Code</th>
        <th>Item Description</th>
        <th>Qty</th>
        <th>UoM</th>
        <th>Unit Price</th>
        <th>Amount</th>
        <th>Status</th>
        <th style="width:32px;"></th>
      </tr>
    </thead>
    <tbody id="po-tbody-${pi}">
      ${po.rows.map((row, ri) => renderItemRow(row, pi, ri)).join("")}
    </tbody>
  </table>
  <div style="padding:8px 12px;border-top:1px solid var(--border-2);">
    <button class="btn btn-secondary btn-sm" onclick="addItemRow(${pi})">
      <i data-lucide="plus" style="width:11px;height:11px;"></i> Add Item Row
    </button>
  </div>`;
}

function renderItemRow(row, pi, ri) {
  const qty   = parseFloat(row["QTY"]) || 0;
  const price = parseFloat(row["UNIT PRICE"]) || 0;
  const calc  = qty * price;

  return `<tr id="row-${pi}-${ri}">
    <td><input value="${escVal(row["PR NO."])}"           data-po="${pi}" data-ri="${ri}" data-field="PR NO."                  onchange="updateField(this)" /></td>
    <td><input value="${escVal(row["REQUESTING DEPT."])}" data-po="${pi}" data-ri="${ri}" data-field="REQUESTING DEPT."         onchange="updateField(this)" /></td>
    <td><input value="${escVal(row["PO DATE"])}"          data-po="${pi}" data-ri="${ri}" data-field="PO DATE"                  onchange="updateField(this)" type="text" /></td>
    <td><input value="${escVal(row["PO NUMBER"])}"        data-po="${pi}" data-ri="${ri}" data-field="PO NUMBER"                onchange="updateField(this)" /></td>
    <td><input value="${escVal(row["SUPPLIER'S NAME"])}"  data-po="${pi}" data-ri="${ri}" data-field="SUPPLIER'S NAME"          onchange="updateField(this)" /></td>
    <td><input value="${escVal(row["ITEM CODE"])}"        data-po="${pi}" data-ri="${ri}" data-field="ITEM CODE"                onchange="updateField(this)" /></td>
    <td><input value="${escVal(row["ITEM DESCRIPTION"])}" data-po="${pi}" data-ri="${ri}" data-field="ITEM DESCRIPTION"         onchange="updateField(this)" /></td>
    <td><input value="${escVal(row["QTY"])}"              data-po="${pi}" data-ri="${ri}" data-field="QTY"                      onchange="updateField(this)" type="number" style="width:60px;" /></td>
    <td><input value="${escVal(row["UoM"])}"              data-po="${pi}" data-ri="${ri}" data-field="UoM"                      onchange="updateField(this)" style="width:60px;" /></td>
    <td><input value="${escVal(row["UNIT PRICE"])}"       data-po="${pi}" data-ri="${ri}" data-field="UNIT PRICE"               onchange="updateField(this)" type="number" style="width:90px;" /></td>
    <td class="calc-cell" id="calc-${pi}-${ri}">${calc ? fmt(calc) : "—"}</td>
    <td>
      <select data-po="${pi}" data-ri="${ri}" data-field="PURCHASE ORDER STATUS" onchange="updateField(this)" style="width:110px;">
        ${STATUS_OPTIONS.map(s => `<option value="${s}" ${row["PURCHASE ORDER STATUS"]===s?"selected":""}>${s||"— Status —"}</option>`).join("")}
      </select>
    </td>
    <td>
      <button class="btn-del-row" onclick="deleteItemRow(${pi},${ri})" title="Delete row">
        <i data-lucide="trash-2" style="width:12px;height:12px;"></i>
      </button>
    </td>
  </tr>`;
}

function updateField(el) {
  const pi    = +el.dataset.po;
  const ri    = +el.dataset.ri;
  const field = el.dataset.field;
  extractedPOs[pi].rows[ri][field] = el.value;

  // Recalculate amount live
  if (field === "QTY" || field === "UNIT PRICE") {
    const row   = extractedPOs[pi].rows[ri];
    const qty   = parseFloat(row["QTY"]) || 0;
    const price = parseFloat(row["UNIT PRICE"]) || 0;
    const calc  = qty * price;
    const calcEl = document.getElementById(`calc-${pi}-${ri}`);
    if (calcEl) calcEl.textContent = calc ? fmt(calc) : "—";
  }
}

function deleteItemRow(pi, ri) {
  extractedPOs[pi].rows.splice(ri, 1);
  // Re-render just that PO's table
  document.getElementById(`po-items-${pi}`).innerHTML =
    renderItemsTable(extractedPOs[pi], pi);
  lucide.createIcons();
  updateSaveSummary();
}

function addItemRow(pi) {
  // Copy PO-level fields from first row
  const first = extractedPOs[pi].rows[0] || {};
  extractedPOs[pi].rows.push({
    "PR NO.": first["PR NO."] || "",
    "REQUESTING DEPT.": first["REQUESTING DEPT."] || "",
    "PO DATE": first["PO DATE"] || "",
    "PO NUMBER": first["PO NUMBER"] || "",
    "SUPPLIER'S NAME": first["SUPPLIER'S NAME"] || "",
    "ITEM CODE": "", "ITEM DESCRIPTION": "", "SPECIFICATIONS": "",
    "QTY": "", "UoM": "", "UNIT PRICE": "",
    "AMOUNT": "", "TOTAL AMOUNT": "",
    "PAYMENT TERMS": first["PAYMENT TERMS"] || "",
    "PR DATE": "", "PR DATE RECEIVED": "", "END USER/S": "",
    "PR REQUIRED DATE": "", "DATE DELIVERED": first["DATE DELIVERED"] || "",
    "REMARKS": "", "PURCHASE ORDER STATUS": first["PURCHASE ORDER STATUS"] || "",
    "ITEMS/SERVICES": "", "ORIGINAL PRICE": "", "TOTAL COST SAVINGS": "",
  });
  document.getElementById(`po-items-${pi}`).innerHTML =
    renderItemsTable(extractedPOs[pi], pi);
  lucide.createIcons();
}

function toggleCard(pi) {
  const table  = document.getElementById(`po-items-${pi}`);
  const toggle = document.getElementById(`toggle-${pi}`);
  const hidden = table.style.display === "none";
  table.style.display   = hidden ? "" : "none";
  toggle.innerHTML      = hidden
    ? '<i data-lucide="chevron-down" style="width:16px;height:16px;"></i>'
    : '<i data-lucide="chevron-right" style="width:16px;height:16px;"></i>';
  lucide.createIcons();
}

function toggleExclude(pi, checked) {
  extractedPOs[pi].excluded = checked;
  document.getElementById(`po-card-${pi}`).classList.toggle("excluded", checked);
  document.getElementById("review-count").textContent =
    `${extractedPOs.filter(p => !p.excluded).length} PO(s) ready`;
  updateSaveSummary();
}

function updateSaveSummary() {
  const active = extractedPOs.filter(p => !p.excluded);
  const rows   = active.reduce((s, p) => s + p.rows.length, 0);
  document.getElementById("save-summary").textContent =
    `${active.length} PO(s), ${rows} rows`;
}

// ═══════════════════════════════════════════════════════════════════════════
// SAVE TO MONITORING
// ═══════════════════════════════════════════════════════════════════════════
document.getElementById("save-btn").addEventListener("click", async () => {
  const active = extractedPOs.filter(p => !p.excluded);
  if (!active.length) { toast("No POs to save", "error"); return; }

  const month = document.getElementById("target-month").value;
  const allRows = active.flatMap(p => p.rows);

  if (!allRows.length) { toast("No rows to save", "error"); return; }

  const btn = document.getElementById("save-btn");
  btn.disabled = true;
  btn.textContent = "Saving…";

  try {
    const res  = await fetch("/api/scanner/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rows: allRows, month }),
    });
    const data = await res.json();

    if (data.success) {
      toast(`✓ ${data.saved} rows saved to ${month} monitoring`);
      // Clear saved POs from review
      extractedPOs = extractedPOs.filter(p => p.excluded);
      renderReview();
    } else {
      toast(data.error || "Save failed", "error");
    }
  } catch(e) {
    toast("Error: " + e.message, "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="save" style="width:14px;height:14px;"></i> Save to Monitoring';
    lucide.createIcons();
  }
});

// ── Spin animation ─────────────────────────────────────────────────────────
const style = document.createElement("style");
style.textContent = `@keyframes spin { to { transform: rotate(360deg); } }`;
document.head.appendChild(style);

lucide.createIcons();
</script>
</body>
</html>
